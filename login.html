<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS 3D — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      background-image:
        radial-gradient(circle at 30% 20%, rgba(0, 242, 254, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
        linear-gradient(180deg, #090d16 0%, #060910 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 1.2rem;
    }

    .login-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 242, 254, 0.05);
      padding: 2.8rem 2.2rem 2.4rem;
      text-align: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      color: #00f2fe;
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.35));
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-title span {
      background: linear-gradient(135deg, #00f2fe, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.72rem 0.9rem;
      background: rgba(10, 15, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.1);
    }

    .form-group input::placeholder {
      color: #475569;
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      margin-top: 0.4rem;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 198, 251, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.82rem;
      color: #fca5a5;
      margin-bottom: 1.2rem;
      display: none;
    }

    .error-msg.visible { display: block; }

    .footer-note {
      margin-top: 1.6rem;
      font-size: 0.72rem;
      color: #475569;
    }

    .footer-note code {
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card { animation: fadeIn 0.5s ease-out; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-row">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1 class="brand-title">NEXUS <span>3D</span></h1>
      </div>
      <p class="brand-sub">Fleet Telemetry &amp; Command — Sign In</p>

      <div class="error-msg" id="errorMsg">
        Invalid username or password. Please try again.
      </div>

      <form method="POST" action="index.php?route=auth" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Sign In to Dashboard</button>
      </form>

      <p class="footer-note">
        Default credentials: <code>admin</code> / <code>nexus3d</code>
      </p>
    </div>
  </div>

  <script>
    // Show error message if redirected with ?error=1
    if (window.location.search.includes('error=1')) {
      document.getElementById('errorMsg').classList.add('visible');
    }
  </script>
</body>
</html>
