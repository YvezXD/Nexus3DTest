<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS 3D — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      background-image:
        radial-gradient(circle at 18% 18%, rgba(2, 132, 199, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 82% 82%, rgba(124, 58, 237, 0.05) 0%, transparent 45%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 1.25rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 20px;
      box-shadow:
        0 10px 30px -5px rgba(15, 23, 42, 0.08),
        0 20px 40px -10px rgba(2, 132, 199, 0.06),
        0 1px 3px rgba(15, 23, 42, 0.05);
      padding: 2.8rem 2.2rem 2.4rem;
      text-align: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 0.35rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      color: #0284c7;
      filter: drop-shadow(0 2px 8px rgba(2, 132, 199, 0.25));
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #0f172a;
    }

    .brand-title span {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 2rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.45rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.78rem 0.95rem;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      color: #0f172a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.94rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .form-group input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.16);
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .login-btn {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      margin-top: 0.5rem;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #b91c1c;
      margin-bottom: 1.25rem;
      display: none;
    }

    .error-msg.visible { display: block; }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.74rem;
      color: #64748b;
    }

    .footer-note code {
      background: #f1f5f9;
      border: 1px solid rgba(15, 23, 42, 0.08);
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      color: #0f172a;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card { animation: fadeIn 0.45s ease-out; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-row">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1 class="brand-title">NEXUS <span>3D</span></h1>
      </div>
      <p class="brand-sub">Fleet Telemetry &amp; Command — Sign In</p>

      <div class="error-msg" id="errorMsg">
        Invalid username or password. Please try again.
      </div>

      <form method="POST" action="index.php?route=auth" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Sign In to Dashboard</button>
      </form>

      <p class="footer-note">
        Default credentials: <code>admin</code> / <code>nexus3d</code>
      </p>
    </div>
  </div>

  <script>
    // Show error message if redirected with ?error=1
    if (window.location.search.includes('error=1')) {
      document.getElementById('errorMsg').classList.add('visible');
    }
  </script>
</body>
</html>
